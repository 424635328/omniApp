name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dkotlin.incremental=false

jobs:
  repository:
    name: Repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Validate repository metadata
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git submodule status
          python -m json.tool .claude/settings.json >/dev/null
          test -f ARCHITECTURE.md
          test -f .claude/shared/rules.md

      - name: Enforce KMP source boundary
        shell: bash
        run: |
          set -euo pipefail
          if rg -n '^(import (android\.|java\.time\.|java\.util\.))' shared/src/commonMain --glob '*.kt'; then
            echo 'Platform-specific import found in commonMain.' >&2
            exit 1
          fi

  shared:
    name: Shared module
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile and test shared targets
        run: ./gradlew :shared:compileDebugKotlinAndroid :shared:compileKotlinDesktop :shared:desktopTest --stacktrace

      - name: Upload shared test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-test-results
          path: shared/build/reports/tests/
          if-no-files-found: error
          retention-days: 14

  unit-tests:
    name: App unit tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run app unit tests and coverage
        run: ./gradlew :app:testDebugUnitTest :app:koverXmlReport --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-results
          path: app/build/reports/tests/
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-coverage-report
          path: app/build/reports/kover/
          if-no-files-found: error
          retention-days: 14

  quality:
    name: Lint and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint and assemble debug and release
        run: ./gradlew :app:lintDebug :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: error
          retention-days: 14

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
